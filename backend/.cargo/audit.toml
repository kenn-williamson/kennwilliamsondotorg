# Cargo audit configuration for kennwilliamsondotorg backend
#
# This file documents which security advisories we are intentionally ignoring
# and the rationale for each decision.

[advisories]
# List of advisory IDs to ignore
ignore = [
    # RUSTSEC-2023-0071: RSA Marvin Attack vulnerability
    # Reason: This vulnerability is in the rsa crate, which is only used by sqlx-mysql.
    # Our project exclusively uses PostgreSQL (see Cargo.toml: features = ["postgres"]).
    # The MySQL feature is not enabled, so this dependency path exists in Cargo.lock
    # but is never compiled or used in our binary.
    "RUSTSEC-2023-0071",

    # NOTE: RUSTSEC-2025-0111 (tokio-tar) and RUSTSEC-2025-0134 (rustls-pemfile) were
    # previously ignored here. Both crates are no longer in Cargo.lock (testcontainers
    # switched to the astral-tokio-tar fork; bollard dropped rustls-pemfile), so the
    # ignores were removed. Caveat: aws-smithy-http-client 1.1.13+ depends on
    # rustls-pemfile again, so RUSTSEC-2025-0134 may resurface after an AWS SDK update.

    # RUSTSEC-2026-0097: rand unsoundness with custom logger using rand::rng()
    # Reason: Our direct dependency (rand 0.9) is updated to 0.9.3 (patched).
    # This ignore covers the transitive rand 0.8.5 pulled in by sqlx-postgres/sqlx-mysql,
    # actix-multipart, and oauth2, which we cannot update until those crates release new versions.
    # TODO: Remove once upstream deps update — tracking in #20
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0104: rustls-webpki 0.101.7
    # Reason: Pulled in transitively by aws-smithy-http-client 1.1.12 (latest available) via
    # hyper-rustls 0.24.2 (legacy compat path). Our actual HTTPS calls use the modern rustls
    # 0.23 / rustls-webpki 0.103.13 line, which is patched. The legacy 0.101.7 path is dead
    # code that we cannot remove until aws-smithy-http-client drops the hyper-rustls 0.24
    # compat connector. Tracked upstream in awslabs/smithy-rs.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
